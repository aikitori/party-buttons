<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1b1f" />
    <title>Party Buttons</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e0a800'/%3E%3Cellipse cx='16' cy='21' rx='11' ry='5' fill='%232b2b33'/%3E%3Cpath d='M8 13h16v5a8 3 0 0 1-16 0z' fill='%23a8232a'/%3E%3Cellipse cx='16' cy='13' rx='8' ry='3' fill='%23d9363e'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header>
      <h1 id="heading" data-i18n="title"></h1>
      <div class="lang" role="group">
        <button type="button" data-lang="de">DE</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </header>

    <div id="banner" class="banner" hidden>
      <p data-i18n="reconnecting"></p>
      <p id="banner-hint" class="banner-hint" hidden data-i18n="reconnectHint"></p>
    </div>

    <main>
      <section id="view-connecting" class="view">
        <p class="status" data-i18n="connecting"></p>
      </section>

      <form id="view-name" class="view name-form" hidden novalidate>
        <label for="name" data-i18n="nameLabel"></label>
        <input id="name" name="name" autocomplete="nickname" autocapitalize="words" enterkeyhint="go" />
        <p id="name-error" class="error" hidden></p>
        <button type="submit" class="primary" data-i18n="joinButton"></button>
      </form>

      <section id="view-joined" class="view" hidden>
        <p class="status"><span data-i18n="joinedAs"></span> <strong id="player-name"></strong></p>
        <div class="badges">
          <p id="score" class="score"></p>
          <button type="button" id="team" class="team" hidden></button>
        </div>
        <div id="team-picker" class="team-picker" hidden>
          <p data-i18n="pickTeam"></p>
          <div id="team-buttons" class="team-buttons"></div>
        </div>
        <button type="button" id="buzzer" class="buzzer" disabled data-i18n="buzzer"></button>
        <div id="choices" class="choices" hidden></div>
        <p id="round-status" class="status round-status"></p>
        <section id="buzzes" class="buzzes" hidden>
          <h2 data-i18n="buzzOrder"></h2>
          <ol id="buzz-list"></ol>
        </section>
        <section id="team-scores" class="team-scores" hidden>
          <h2 data-i18n="teamScores"></h2>
          <div id="team-score-list"></div>
        </section>
      </section>

      <form id="view-code" class="view name-form" hidden novalidate>
        <p class="status" data-i18n="wrongRoom"></p>
        <label for="code" data-i18n="codeLabel"></label>
        <input id="code" name="code" class="code-input" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go" />
        <p id="code-error" class="error" hidden data-i18n="codeInvalid"></p>
        <button type="submit" class="primary" data-i18n="codeButton"></button>
      </form>

      <section id="view-notice" class="view" hidden>
        <p id="notice-text" class="status"></p>
        <button type="button" id="notice-button" class="primary" hidden></button>
      </section>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
