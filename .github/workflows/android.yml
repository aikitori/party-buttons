# Tests und APK bauen.
# - Push auf main / manuell: signiertes APK als GitHub-Release (v0.<Laufnummer>).
# - andere Branches und Pull Requests: nur Prüfbau (Debug-APK als Artefakt).
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # Release anlegen

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Seite der Mitspielenden bauen
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: ./gradlew --console=plain :core:test :server:test

      - name: Signaturschlüssel aus den Secrets holen
        if: env.RELEASE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Signaturschlüssel fehlt::Diese Repo-Secrets fehlen:$missing. Einmalig einrichten: bash scripts/keystore-einrichten.sh (README, Abschnitt Release)."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Signiertes APK bauen
        if: env.RELEASE == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --console=plain :app:assembleRelease -PversionCode=${{ github.run_number }} -PversionName=0.${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/party-buttons.apk"
          # sicherstellen, dass es wirklich mit dem festen Schlüssel signiert ist
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$GITHUB_WORKSPACE/party-buttons.apk"

      - name: Als Release veröffentlichen
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.${{ github.run_number }}
          name: Party Buttons v0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: party-buttons.apk
          body: |
            Automatisch gebaut aus ${{ github.sha }}.
            Aufs Handy: https://github.com/${{ github.repository }}/releases/latest/download/party-buttons.apk

      - name: Prüfbau (Debug-APK)
        if: env.RELEASE != 'true'
        run: ./gradlew --console=plain :app:assembleDebug -PversionCode=${{ github.run_number }}

      - name: Prüfbau hochladen
        if: env.RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: party-buttons-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
