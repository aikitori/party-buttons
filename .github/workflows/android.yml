# Tests und Debug-APK bei jedem Push und Pull Request. Signiertes Release kommt mit M5.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Seite der Mitspielenden bauen
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests und Debug-APK
        run: ./gradlew --console=plain :core:test :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: party-buttons-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
